# Docker Compose — staging
# Same shape as production: no host ports. Attach the staging domain to the
# client service (port 3000) in Dokploy; the API stays private behind the
# site's /api.
version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    expose:
      - "5000"
    environment:
      NODE_ENV: staging
      PORT: "5000"
      DATABASE_URL: ${DATABASE_URL}
      HUMAN_MENTORS_ENABLED: ${HUMAN_MENTORS_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      FROM_EMAIL: ${FROM_EMAIL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Operator keys (Maya, the AI operator): label:sha256 entries and the admin
      # service account they act as (maya@potential.org). Bearer auth is off
      # while unset. See server/docs/operator-access.md.
      OPERATOR_API_KEYS: ${OPERATOR_API_KEYS:-}
      OPERATOR_SERVICE_USER_EMAIL: ${OPERATOR_SERVICE_USER_EMAIL:-}
      # CRM sync: learner events queue in crm_outbox; sent only when
      # CRM_SYNC_ENABLED is "true" (needs the URL, key and program id).
      # CRM events only: they never send an email.
      CRM_SYNC_ENABLED: ${CRM_SYNC_ENABLED:-}
      CRM_INTAKE_URL: ${CRM_INTAKE_URL:-}
      POTENTIAL_CRM_INTAKE_KEY: ${POTENTIAL_CRM_INTAKE_KEY:-}
      CRM_PROGRAM_ID: ${CRM_PROGRAM_ID:-}
      CRM_COHORT_ID: ${CRM_COHORT_ID:-}
    volumes:
      - uploads_staging:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AI_BACKEND_URL: ${NEXT_PUBLIC_AI_BACKEND_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_HUMAN_MENTORS_ENABLED: ${HUMAN_MENTORS_ENABLED:-false}
    expose:
      - "3000"
    environment:
      NODE_ENV: staging
      PORT: "3000"
    healthcheck:
      # The site's own port (127.0.0.1: Next listens on IPv4). Traefik only
      # routes to a healthy container, so check every 5 s while it starts.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  uploads_staging:
