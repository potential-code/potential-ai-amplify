# Docker Compose — staging
# Runs on different host ports (5001/3001) so it can coexist with production on the same Dokploy host
version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "5001:5000"
    environment:
      NODE_ENV: staging
      PORT: "5000"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      FROM_EMAIL: ${FROM_EMAIL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # CRM sync: learner events queue in crm_outbox; sent only when
      # CRM_SYNC_ENABLED is "true" (needs the URL, key and program id).
      # CRM events only: they never send an email.
      CRM_SYNC_ENABLED: ${CRM_SYNC_ENABLED:-}
      CRM_INTAKE_URL: ${CRM_INTAKE_URL:-}
      POTENTIAL_CRM_INTAKE_KEY: ${POTENTIAL_CRM_INTAKE_KEY:-}
      CRM_PROGRAM_ID: ${CRM_PROGRAM_ID:-}
      CRM_COHORT_ID: ${CRM_COHORT_ID:-}
    volumes:
      - uploads_staging:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AI_BACKEND_URL: ${NEXT_PUBLIC_AI_BACKEND_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: staging
      PORT: "3000"
      # Google Tag Manager container id (GTM-XXXX), read at run time by
      # /public-config: changing it needs a restart, not a rebuild. Empty = no
      # GTM and no cookie banner.
      GTM_CONTAINER_ID: ${GTM_CONTAINER_ID:-}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  uploads_staging:
