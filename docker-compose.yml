# Docker Compose — production
version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      # Signs session cookies; falls back to JWT_SECRET when unset.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      # The public site URL (sessions are first-party there); defaults to FRONTEND_URL.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      # Proxy hops skipped when finding a visitor's IP; defaults to private ranges.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      FRONTEND_URL: ${FRONTEND_URL}
      FROM_EMAIL: ${FROM_EMAIL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      COPILOT_SERVICE_JWT_SECRET: ${COPILOT_SERVICE_JWT_SECRET}
      # Learner messages (bell, banners, announcement emails): off until the
      # client signs off. "true" turns them on.
      LEARNER_NOTIFICATIONS_ENABLED: ${LEARNER_NOTIFICATIONS_ENABLED:-false}
      # Reminder and booking emails (sessions, events): off until sign-off.
      REMINDER_EMAILS_ENABLED: ${REMINDER_EMAILS_ENABLED:-false}
      # Zoom meetings for live events (Server-to-Server OAuth). Without them,
      # admins can still use another link or an in-person venue.
      ZOOM_ACCOUNT_ID: ${ZOOM_ACCOUNT_ID:-}
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID:-}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET:-}
      ZOOM_HOST_USER_ID: ${ZOOM_HOST_USER_ID:-}
      ZOOM_WEBHOOK_SECRET_TOKEN: ${ZOOM_WEBHOOK_SECRET_TOKEN:-}
      NEXT_PUBLIC_AI_BACKEND_URL: ${NEXT_PUBLIC_AI_BACKEND_URL}
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        # The site forwards /api and /uploads to the API at this address, so
        # the browser only talks to the site and the session cookie is first-party.
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://server:5000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AI_BACKEND_URL: ${NEXT_PUBLIC_AI_BACKEND_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    # Host ports 3000 (Dokploy dashboard) and 3001 are already allocated on
    # this host, so the client is published on 8090 to avoid the conflict.
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  uploads:
